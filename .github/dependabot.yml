version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/app-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/app-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "zone.js"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
